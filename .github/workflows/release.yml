name: Release

on:
  push:
    tags:
      - 'desktop-v*'
      - 'android-v*'

permissions:
  contents: write

jobs:
  build-desktop:
    if: startsWith(github.ref_name, 'desktop-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run desktop:portable
      - uses: softprops/action-gh-release@v2
        with:
          name: Northrealm MQTT Desktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*Setup*.exe
            release/latest.yml
            release/*.blockmap
            release/*portable*.zip

  build-android:
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Sync Android project
        run: npm run android:sync
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/northrealm-release.jks"
      - name: Build signed Android APK
        env:
          NR_RELEASE_STORE_FILE: ${{ runner.temp }}/northrealm-release.jks
          NR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Prepare Android asset
        id: release_meta
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/Northrealm-Android-v${VERSION}.apk"
      - name: Remove legacy asset name
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "$GITHUB_REF_NAME" "Northrealm-Android-${GITHUB_REF_NAME}.apk" --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          name: Northrealm Android v${{ steps.release_meta.outputs.version }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: release-android/*.apk
