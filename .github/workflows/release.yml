name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portable zip (Windows)
        run: npm run desktop:portable

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          if-no-files-found: error
          path: |
            release/*Setup*.exe
            release/latest.yml
            release/*.blockmap
            release/*portable*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Android project
        run: npm run android:sync

      - name: Build Android debug APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Prepare Android release asset
        shell: bash
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-android/Northrealm-android-debug-${GITHUB_REF_NAME}.apk"

      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          if-no-files-found: error
          path: release-android/*.apk

  release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/windows

      - name: Download Android release assets
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-assets/android

      - name: Prepare release body
        shell: bash
        run: |
          VERSION_BODY=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$VERSION_BODY" ]; then
            cp "$VERSION_BODY" release-body.md
          else
            printf '%s\n' \
              '## Release assets' \
              '- Windows installer and portable package' \
              '- Android debug APK for installation and validation' \
              '' \
              '## Notes' \
              '- The Android package in the release is a debug-signed APK intended for testing and internal distribution.' \
              '- If an older debug build cannot be upgraded directly, uninstall the previous package and install again.' \
              > release-body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Northrealm ${{ github.ref_name }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/windows/**/*
            release-assets/android/*.apk
