name: Release

# One tag -> one Release carrying the Windows installer, the Windows portable zip and the signed Android APK.
#
#   git tag v0.1.15 && git push origin v0.1.15
#
# Manual runs (workflow_dispatch) are a rehearsal: everything is built and uploaded as workflow
# artifacts, but no GitHub Release is created.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Check that tag, package.json and Android versions agree
        id: v
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          GRADLE_VERSION="$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)"
          GRADLE_CODE="$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)"
          echo "package.json:        $PKG_VERSION"
          echo "android versionName: $GRADLE_VERSION (versionCode $GRADLE_CODE)"
          if [ "$PKG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) != android versionName ($GRADLE_VERSION)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag:                 $TAG_VERSION"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
              exit 1
            fi
            test -f ".github/release-notes/v${PKG_VERSION}.md" \
              || { echo "::error::missing .github/release-notes/v${PKG_VERSION}.md"; exit 1; }
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run desktop:portable
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          if-no-files-found: error
          path: |
            release/*Setup*.exe
            release/latest.yml
            release/*.blockmap
            release/*portable*.zip

  build-android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails on current runner images because the legacy
          # "tools" package no longer exists in cmdline-tools. The runner already ships the SDK and
          # Gradle downloads what the build needs once the licenses are accepted (done by this action).
          packages: ''
      - name: Install dependencies
        run: npm ci
      - name: Sync Android project
        run: npm run android:sync
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/northrealm-release.jks"
      - name: Build signed Android APK
        env:
          NR_RELEASE_STORE_FILE: ${{ runner.temp }}/northrealm-release.jks
          NR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Name the APK and verify its signature
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/Northrealm-Android-v${VERSION}.apk"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "release-android/Northrealm-Android-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: release-android/*.apk

  publish:
    # Only a pushed tag publishes. Manual runs stop after the build jobs (rehearsal).
    if: github.ref_type == 'tag'
    needs: [check-version, build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -l release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.check-version.outputs.version }}
          body_path: .github/release-notes/v${{ needs.check-version.outputs.version }}.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*Setup*.exe
            release-assets/latest.yml
            release-assets/*.blockmap
            release-assets/*portable*.zip
            release-assets/*.apk
